name: Package RAMN SecOC prebuilt Renode lab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ramn-secoc-package-only.yml'

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled SecOC ELFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir compiled
          gh run download 33931724872 --repo rpdavid78/machinelearning --name ramn-secoc-elfs --dir compiled
          for f in ECUA.elf ECUB.elf ECUC.elf ECUD.elf; do test -s "compiled/$f"; done

      - name: Verify ELFs
        run: |
          set -euo pipefail
          cd compiled
          sed 's#secoc-elf/##' ELF_SHA256SUMS.txt | sha256sum -c -
          for f in ECUA.elf ECUB.elf ECUC.elf ECUD.elf; do
            desc=$(file "$f")
            hdr=$(readelf -h "$f")
            syms=$(readelf -sW "$f")
            grep -q 'ELF 32-bit.*ARM' <<<"$desc"
            grep -q 'Machine:.*ARM' <<<"$hdr"
            grep -q 'RAMN_SECOC_ProtectTx' <<<"$syms"
            grep -q 'RAMN_SECOC_VerifyRx' <<<"$syms"
          done

      - name: Assemble package
        run: |
          set -euo pipefail
          PKG="$PWD/ramn-renode-lab-secoc-research-v3-prebuilt"
          mkdir -p "$PKG/firmware-secoc" "$PKG/renode" "$PKG/tools" "$PKG/docs"
          cp compiled/ECUA.elf compiled/ECUB.elf compiled/ECUC.elf compiled/ECUD.elf "$PKG/firmware-secoc/"
          cp compiled/BUILD_PROVENANCE.txt "$PKG/firmware-secoc/"
          sed 's#secoc-elf/##' compiled/ELF_SHA256SUMS.txt > "$PKG/firmware-secoc/ELF_SHA256SUMS.txt"

          cat > "$PKG/renode/lab-secoc-custom.resc" <<'EOF'
          :name: RAMN Argos-Car SecOC research lab - prebuilt firmware
          :description: Runs 4 RAMN ECUs with prebuilt SecOC-like firmware images.
          emulation CreateCANHub "canHub"
          set global.name "ECUA"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/GATEWAY.repl
          $bin=@./firmware-secoc/ECUA.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub
          set global.name "ECUB"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/CHASSIS.repl
          $bin=@./firmware-secoc/ECUB.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub
          set global.name "ECUC"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/POWERTRAIN.repl
          $bin=@./firmware-secoc/ECUC.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub
          set global.name "ECUD"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/BODY.repl
          $bin=@./firmware-secoc/ECUD.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub
          emulation SetGlobalQuantum "0.00001"
          machine CreateSocketCANBridge "socketcan" "vcan0" ensureFdFrames=true
          connector Connect socketcan canHub
          start
          EOF
          sed -i 's/^          //' "$PKG/renode/lab-secoc-custom.resc"

          cat > "$PKG/tools/setup_vcan.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          IFACE=${1:-vcan0}
          [[ "$IFACE" == vcan* ]] || { echo "Refusing non-vcan interface: $IFACE" >&2; exit 2; }
          sudo modprobe vcan
          sudo ip link del "$IFACE" 2>/dev/null || true
          sudo ip link add dev "$IFACE" type vcan
          sudo ip link set "$IFACE" mtu 72
          sudo ip link set up "$IFACE"
          ip -details link show "$IFACE"
          EOF
          sed -i 's/^          //' "$PKG/tools/setup_vcan.sh"
          chmod +x "$PKG/tools/setup_vcan.sh"

          cat > "$PKG/tools/verify_prebuilt_elfs.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT=$(cd "$(dirname "$0")/.." && pwd)
          cd "$ROOT/firmware-secoc"
          sha256sum -c ELF_SHA256SUMS.txt
          for f in ECUA.elf ECUB.elf ECUC.elf ECUD.elf; do
            test -s "$f"
            if command -v readelf >/dev/null 2>&1; then
              hdr=$(readelf -h "$f"); syms=$(readelf -sW "$f")
              grep -q 'Machine:.*ARM' <<<"$hdr"
              grep -q 'RAMN_SECOC_ProtectTx' <<<"$syms"
              grep -q 'RAMN_SECOC_VerifyRx' <<<"$syms"
            fi
          done
          echo 'OK: four prebuilt SecOC-like ARM ELFs verified.'
          EOF
          sed -i 's/^          //' "$PKG/tools/verify_prebuilt_elfs.sh"
          chmod +x "$PKG/tools/verify_prebuilt_elfs.sh"

          cat > "$PKG/VERSION.txt" <<'EOF'
          package=ramn-renode-lab-secoc-research-v3-prebuilt
          project=Detectores Argos-Car
          ramn_commit=8ea9db078460e506f01e39182420848cc0b4bedb
          cubeide_docker=xanderhendriks/stm32cubeide:2.1.1
          build=Release
          defines=ENABLE_SECOC_LIKE WATCHDOG_ENABLE
          prebuilt_elfs=yes
          EOF
          sed -i 's/^          //' "$PKG/VERSION.txt"

          cat > "$PKG/README.md" <<'EOF'
          # Argos-Car — RAMN + Renode + SecOC-like (v3 prebuilt)

          Pacote de pesquisa acadêmica para RAMN + Renode + SocketCAN/vcan0. Esta versão já contém os quatro `.elf` recompilados com o mecanismo SecOC-like; não é necessário recompilar.

          ## Firmware incluído

          `firmware-secoc/ECUA.elf`, `ECUB.elf`, `ECUC.elf` e `ECUD.elf`.

          Proveniência: RAMN commit `8ea9db078460e506f01e39182420848cc0b4bedb`, build `Release`, STM32CubeIDE via `xanderhendriks/stm32cubeide:2.1.1`, defines `ENABLE_SECOC_LIKE` e `WATCHDOG_ENABLE`.

          ## Relação com AUTOSAR SecOC

          Esta é uma PoC acadêmica inspirada no AUTOSAR Secure Onboard Communication (SecOC), não uma pilha AUTOSAR Classic completa nem uma implementação conforme/certificada.

          ```text
          Application -> COM -> PduR -> SecOC -> PduR -> CanIf -> CanDrv -> CAN
                                      |
                                      +-> Csm / CryptoIf / Crypto Driver
          ```

          A PoC reproduz diretamente no RAMN as duas propriedades centrais: autenticação/integridade por MAC e freshness/anti-replay. O frame default de 8 bytes usa bytes 0..1 para payload funcional, 2..3 para freshness de 16 bits e 4..7 para HMAC-SHA-256 truncado a 32 bits. Conceitualmente:

          ```text
          Trunc32(HMAC-SHA256_K(0xA1 || CAN_ID || payload || freshness))
          ```

          No TX, a proteção é aplicada no caminho de `RAMN_DBC_FormatDefaultPeriodicMessage`; no RX, MAC e freshness são verificados antes da atualização do estado DBC. Não são implementados como módulos independentes `COM`, `PduR`, `SecOC`, `Csm`, `CryptoIf`, `CanIf`, `CanDrv`, ARXML ou Freshness Manager completo. A nomenclatura correta é **RAMN com mecanismo SecOC-like**.

          ## Executar

          ```bash
          ./tools/verify_prebuilt_elfs.sh
          ./tools/setup_vcan.sh vcan0
          renode-run -- -e 'i @./renode/lab-secoc-custom.resc'
          ```

          Em outro terminal:

          ```bash
          candump -x vcan0
          ```

          O `.resc` carrega diretamente os quatro ELFs locais.

          ## Hipótese experimental Argos-Car

          - atacante sem chave: MAC inválido, rejeição pelo SecOC-like;
          - replay: freshness repetido, rejeição pelo SecOC-like;
          - flooding/burst: permanece relevante para P0-CAN-001;
          - supressão/gap: permanece relevante para P0-CAN-005;
          - ECU comprometida com chave válida: pode passar pela autenticação, mantendo a necessidade de IDS comportamental, especialmente P0-CAN-002.
          EOF
          sed -i 's/^          //' "$PKG/README.md"

          cat > "$PKG/docs/BUILD_VERIFICATION.md" <<'EOF'
          # Build verification
          - Four targets compiled successfully: ECUA, ECUB, ECUC, ECUD.
          - RAMN commit: `8ea9db078460e506f01e39182420848cc0b4bedb`.
          - Release build with `ENABLE_SECOC_LIKE` and `WATCHDOG_ENABLE`.
          - Each ELF is ARM/EABI5 and contains `RAMN_SECOC_ProtectTx` and `RAMN_SECOC_VerifyRx`.
          - Per-ELF SHA-256 hashes are in `firmware-secoc/ELF_SHA256SUMS.txt`.
          EOF
          sed -i 's/^          //' "$PKG/docs/BUILD_VERIFICATION.md"
          (cd "$PKG" && ./tools/verify_prebuilt_elfs.sh)

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: ramn-renode-lab-secoc-research-v3-prebuilt
          path: ramn-renode-lab-secoc-research-v3-prebuilt/
          if-no-files-found: error
          retention-days: 1
