name: Package RAMN SecOC prebuilt Renode lab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ramn-secoc-package-only.yml'

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download previously compiled four-ECU SecOC artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p compiled
          gh run download 33931724872 --repo rpdavid78/machinelearning --name ramn-secoc-elfs --dir compiled
          ls -lah compiled
          test -s compiled/ECUA.elf
          test -s compiled/ECUB.elf
          test -s compiled/ECUC.elf
          test -s compiled/ECUD.elf

      - name: Verify compiled ELFs
        run: |
          set -euo pipefail
          cd compiled
          sha256sum -c ELF_SHA256SUMS.txt
          for f in ECUA.elf ECUB.elf ECUC.elf ECUD.elf; do
            file "$f" | grep -q 'ELF 32-bit.*ARM'
            hdr=$(readelf -h "$f")
            syms=$(readelf -sW "$f")
            grep -q 'Machine:.*ARM' <<<"$hdr"
            grep -q 'RAMN_SECOC_ProtectTx' <<<"$syms"
            grep -q 'RAMN_SECOC_VerifyRx' <<<"$syms"
          done

      - name: Assemble ready-to-run Renode package
        run: |
          set -euo pipefail
          PKG="$PWD/ramn-renode-lab-secoc-research-v3-prebuilt"
          mkdir -p "$PKG/firmware-secoc" "$PKG/renode" "$PKG/tools" "$PKG/docs"
          cp compiled/ECUA.elf compiled/ECUB.elf compiled/ECUC.elf compiled/ECUD.elf "$PKG/firmware-secoc/"
          cp compiled/ELF_SHA256SUMS.txt compiled/BUILD_PROVENANCE.txt "$PKG/firmware-secoc/"

          cat > "$PKG/renode/lab-secoc-custom.resc" <<'EOF'
          :name: RAMN Argos-Car SecOC research lab - prebuilt firmware
          :description: Runs 4 RAMN ECUs with locally built SecOC-like firmware images.

          emulation CreateCANHub "canHub"

          set global.name "ECUA"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/GATEWAY.repl
          $bin=@./firmware-secoc/ECUA.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub

          set global.name "ECUB"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/CHASSIS.repl
          $bin=@./firmware-secoc/ECUB.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub

          set global.name "ECUC"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/POWERTRAIN.repl
          $bin=@./firmware-secoc/ECUC.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub

          set global.name "ECUD"
          mach create $name
          include @platforms/boards/ramn.repl
          include @platforms/boards/ramn/BODY.repl
          $bin=@./firmware-secoc/ECUD.elf
          macro reset
          """
          sysbus LoadELF $bin
          """
          runMacro $reset
          connector Connect sysbus.fdcan1 canHub

          emulation SetGlobalQuantum "0.00001"
          machine CreateSocketCANBridge "socketcan" "vcan0" ensureFdFrames=true
          connector Connect socketcan canHub
          start
          EOF
          sed -i 's/^          //' "$PKG/renode/lab-secoc-custom.resc"

          cat > "$PKG/tools/setup_vcan.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          IFACE=${1:-vcan0}
          if [[ "$IFACE" != vcan* ]]; then
            echo "Refusing non-vcan interface: $IFACE" >&2
            exit 2
          fi
          sudo modprobe vcan
          sudo ip link del "$IFACE" 2>/dev/null || true
          sudo ip link add dev "$IFACE" type vcan
          sudo ip link set "$IFACE" mtu 72
          sudo ip link set up "$IFACE"
          ip -details link show "$IFACE"
          EOF
          sed -i 's/^          //' "$PKG/tools/setup_vcan.sh"
          chmod +x "$PKG/tools/setup_vcan.sh"

          cat > "$PKG/tools/verify_prebuilt_elfs.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT=$(cd "$(dirname "$0")/.." && pwd)
          cd "$ROOT/firmware-secoc"
          sha256sum -c ELF_SHA256SUMS.txt
          for f in ECUA.elf ECUB.elf ECUC.elf ECUD.elf; do
            test -s "$f"
            if command -v readelf >/dev/null 2>&1; then
              hdr=$(readelf -h "$f")
              syms=$(readelf -sW "$f")
              grep -q 'Machine:.*ARM' <<<"$hdr"
              grep -q 'RAMN_SECOC_ProtectTx' <<<"$syms"
              grep -q 'RAMN_SECOC_VerifyRx' <<<"$syms"
            fi
          done
          echo 'OK: four prebuilt SecOC-like ARM ELFs verified.'
          EOF
          sed -i 's/^          //' "$PKG/tools/verify_prebuilt_elfs.sh"
          chmod +x "$PKG/tools/verify_prebuilt_elfs.sh"

          cat > "$PKG/VERSION.txt" <<'EOF'
          package=ramn-renode-lab-secoc-research-v3-prebuilt
          project=Detectores Argos-Car
          ramn_commit=8ea9db078460e506f01e39182420848cc0b4bedb
          cubeide_docker=xanderhendriks/stm32cubeide:2.1.1
          build=Release
          defines=ENABLE_SECOC_LIKE WATCHDOG_ENABLE
          prebuilt_elfs=yes
          EOF
          sed -i 's/^          //' "$PKG/VERSION.txt"

          cat > "$PKG/README.md" <<'EOF'
          # Argos-Car — RAMN + Renode + SecOC-like (v3 prebuilt)

          Pacote de pesquisa acadêmica para o laboratório virtual RAMN + Renode + SocketCAN/vcan0. Esta versão já contém os quatro `.elf` recompilados com o mecanismo SecOC-like; não é necessário recompilar para executar o experimento.

          ## Firmware incluído

          ```text
          firmware-secoc/ECUA.elf
          firmware-secoc/ECUB.elf
          firmware-secoc/ECUC.elf
          firmware-secoc/ECUD.elf
          ```

          Proveniência: RAMN commit `8ea9db078460e506f01e39182420848cc0b4bedb`, build `Release`, STM32CubeIDE via `xanderhendriks/stm32cubeide:2.1.1`, defines `ENABLE_SECOC_LIKE` e `WATCHDOG_ENABLE`.

          Os quatro binários foram verificados como ELF ARM/EABI5 e contêm `RAMN_SECOC_ProtectTx` e `RAMN_SECOC_VerifyRx`. Os hashes estão em `firmware-secoc/ELF_SHA256SUMS.txt`.

          ## Relação com AUTOSAR SecOC

          Esta é uma PoC acadêmica inspirada no **AUTOSAR Secure Onboard Communication (SecOC)**. Não é uma implementação AUTOSAR Classic completa nem uma implementação conforme/certificada.

          O fluxo AUTOSAR conceitual é:

          ```text
          Application -> COM -> PduR -> SecOC -> PduR -> CanIf -> CanDrv -> CAN
                                      |
                                      +-> Csm / CryptoIf / Crypto Driver
          ```

          A PoC implementa diretamente no RAMN as duas propriedades centrais usadas pelo SecOC: autenticidade/integridade por MAC e freshness/anti-replay por contador.

          No frame default RAMN de 8 bytes:

          ```text
          bytes 0..1  payload funcional
          bytes 2..3  freshness de 16 bits
          bytes 4..7  HMAC-SHA-256 truncado para 32 bits
          ```

          O autenticador é calculado conceitualmente como:

          ```text
          Trunc32(HMAC-SHA256_K(0xA1 || CAN_ID || payload || freshness))
          ```

          No TX, a proteção é aplicada no caminho de `RAMN_DBC_FormatDefaultPeriodicMessage`. No RX, a autenticação e o freshness são verificados antes de o decoder DBC atualizar o estado lógico da ECU.

          Não foram implementados como módulos AUTOSAR separados `COM`, `PduR`, `SecOC`, `Csm`, `CryptoIf`, `CanIf`, `CanDrv`, configuração ARXML ou um Freshness Manager AUTOSAR completo. A nomenclatura correta é **RAMN com mecanismo SecOC-like**.

          ## Executar

          Pré-requisitos: Renode com a plataforma RAMN, `iproute2` e `can-utils`.

          No diretório extraído:

          ```bash
          ./tools/verify_prebuilt_elfs.sh
          ./tools/setup_vcan.sh vcan0
          renode-run -- -e 'i @./renode/lab-secoc-custom.resc'
          ```

          Em outro terminal:

          ```bash
          candump -x vcan0
          ```

          O `.resc` carrega diretamente os quatro ELFs locais em `firmware-secoc/`.

          ## Hipótese experimental Argos-Car

          ```text
          atacante sem chave          -> MAC inválido -> SecOC-like rejeita
          replay de frame legítimo    -> freshness repetido -> SecOC-like rejeita
          flooding/burst              -> SecOC não impede ocupação do barramento -> P0-CAN-001
          supressão/gap               -> SecOC não impede -> P0-CAN-005
          ECU com chave comprometida  -> MAC/freshness válidos -> SecOC pode aceitar -> IDS continua necessário
          ```

          O objetivo é separar experimentalmente a garantia criptográfica da detecção comportamental do Argos-Car.
          EOF
          sed -i 's/^          //' "$PKG/README.md"

          cat > "$PKG/docs/BUILD_VERIFICATION.md" <<'EOF'
          # Build verification

          - Four firmware targets compiled successfully: ECUA, ECUB, ECUC, ECUD.
          - RAMN source pinned to commit `8ea9db078460e506f01e39182420848cc0b4bedb`.
          - Build mode: Release.
          - Defines: `ENABLE_SECOC_LIKE`, `WATCHDOG_ENABLE`.
          - Each ELF is ARM/EABI5 and exports `RAMN_SECOC_ProtectTx` and `RAMN_SECOC_VerifyRx`.
          - SHA-256 checksums are stored in `firmware-secoc/ELF_SHA256SUMS.txt`.
          EOF
          sed -i 's/^          //' "$PKG/docs/BUILD_VERIFICATION.md"

          (cd "$PKG" && ./tools/verify_prebuilt_elfs.sh)

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: ramn-renode-lab-secoc-research-v3-prebuilt
          path: ramn-renode-lab-secoc-research-v3-prebuilt/
          if-no-files-found: error
          retention-days: 1
